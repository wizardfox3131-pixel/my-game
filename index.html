<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teater的人</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);
  color:#fff;
  padding:20px;
}
h1{
  font-size:2.2rem;
  margin-bottom:30px;
  text-shadow:0 2px 10px rgba(0,0,0,.3);
  letter-spacing:4px;
}
button{
  font-size:1.4rem;
  padding:16px 48px;
  border:none;
  border-radius:50px;
  background:#fff;
  color:#764ba2;
  font-weight:bold;
  cursor:pointer;
  box-shadow:0 8px 25px rgba(0,0,0,.2);
  transition:transform .2s,box-shadow .2s;
}
button:hover{transform:scale(1.05);box-shadow:0 12px 30px rgba(0,0,0,.3)}
button:active{transform:scale(.98)}
#result{
  font-size:3rem;
  margin:40px 0 15px;
  min-height:70px;
  font-weight:bold;
  text-shadow:0 4px 15px rgba(0,0,0,.3);
  transition:opacity .3s;
}
#cp{
  font-size:1.3rem;
  color:#ffeb3b;
  min-height:30px;
  text-shadow:0 2px 8px rgba(0,0,0,.3);
  margin-bottom:30px;
}
.card{
  background:rgba(255,255,255,.15);
  backdrop-filter:blur(10px);
  border-radius:24px;
  padding:40px 50px;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  text-align:center;
  max-width:480px;
  width:100%;
}
.list-title{
  font-size:1rem;
  opacity:.8;
  margin-bottom:10px;
}
#all{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  justify-content:center;
}
#all span{
  background:rgba(255,255,255,.2);
  padding:6px 14px;
  border-radius:20px;
  font-size:.9rem;
}
</style>
</head>
<body>
<div class="card">
  <p><a href="chess.html" style="color:#fff">♞ 玩国际象棋-西洋棋</a></p>
  <a href="记录.html" target="_blank" rel="noopener noreferrer">查看照片回忆</a>
  <h1>抽名字游戏</h1>
  <button onclick="draw()">✨ 抽一个</button>
  <div id="result"></div>
  <div id="cp"></div>
  <div class="list-title">［全部人］</div>
  <div id="all"></div>
</div>
<script>
const names = ["许翌煌","陈劲熙","林健哲","黄向阳","许瑈晅","蔡佳恩","陈楽颐","刘艺渲","戴玉琳","林子宸"];
const cps = {
  "林健哲":"蔡佳恩",
  "蔡佳恩":"林健哲",
  "许翌煌":"许瑈晅",
  "陈劲熙":"许瑈晅",
  "许瑈晅":["许翌煌","陈劲熙"],
  "刘艺渲":"朱家庆"
};
document.getElementById("all").innerHTML = names.map(n=>`<span>${n}</span>`).join("");
function draw(){
  const el = document.getElementById("result");
  el.style.opacity = 0;
  setTimeout(()=>{
    const n = names[Math.floor(Math.random()*names.length)];
    el.textContent = n;
    el.style.opacity = 1;
    let msg = "";
    if(cps[n]){
      msg = Array.isArray(cps[n])
        ? "💖 有机会解锁CP：" + cps[n].join(" / ")
        : "💖 有机会解锁CP：" + cps[n];
    }
    document.getElementById("cp").textContent = msg;
  },200);
}
</script>
</body>
</html>
